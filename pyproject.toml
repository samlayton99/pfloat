[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pfloat"
version = "0.1.0"
description = "p-bit floating point: a correctly rounded array type for any significand width from 2 to 4096 bits, with reference LAPACK least squares, LU and Cholesky ported to it"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "third_party/lapack-3.12.1/LICENSE"]
authors = [{ name = "Sam Layton" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "mpmath>=1.3"]
keywords = ["floating point", "low precision", "arbitrary precision", "emulation", "least squares", "LAPACK", "numerical analysis",
            "mixed precision", "MPFR", "binary128"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
mp = ["gmpy2>=2.3"]
test = ["pytest>=7", "gmpy2>=2.3"]
torch = ["torch>=2.0"]

[project.urls]
Repository = "https://github.com/samlayton99/pfloat"
Documentation = "https://github.com/samlayton99/pfloat/blob/main/docs/DESIGN.md"
Issues = "https://github.com/samlayton99/pfloat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pfloat = ["csrc/*.c", "csrc/*.cpp", "csrc/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
